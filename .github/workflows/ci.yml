name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scrub-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Scrub gate
        run: node scripts/scrub-gate.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        env:
          # The runner image ships Google Chrome. A missing browser fails the PDF tests instead of skipping them.
          CHROME_PATH: /usr/bin/google-chrome
          COMPLYRAIL_REQUIRE_CHROME: '1'
          COMPLYRAIL_CHROME_NO_SANDBOX: '1'
        run: npm test
